[platformio]
default_envs = master

; ---------- MASTER (STM32F407VE): firmware final ----------
[env:master]
platform = ststm32
board = black_f407ve
framework = arduino
upload_protocol = serial
upload_port = com11
monitor_port = com11
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	stm32duino/STM32duino FreeRTOS
build_src_filter = -<*> +<master/>
build_unflags = -Os
build_flags =
    -O2
    -D INCLUDE_uxTaskGetStackHighWaterMark=1
    -D SOLVER_EVENTS=1

; ---------- Ferramentas de bancada que rodam no Master ----------
[env:flasher]
extends = env:master
build_src_filter = -<*> +<flasher/>

[env:sweep]
extends = env:master
build_src_filter = -<*> +<sweep/>
build_flags =
    -O2
    -D METRICS_ENABLED=0
    -D SOLVER_EVENTS=0

; ---------- ATUADOR (STM32F103C8, Blue Pill) ----------
[env:actuator]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
upload_port = com11
monitor_port = com11
build_src_filter = -<*> +<actuator/>
build_unflags = -Os
build_flags =
    -O2
    -D HAVE_HWSERIAL2
lib_ignore = Robot, Board, CubeCore, CubeUI, Screens, Input